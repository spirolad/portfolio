services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: maven:3.9.11-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
      - backend-target:/workspace/target
      - m2-cache:/root/.m2
    depends_on:
      db:
        condition: service_healthy
    command: mvn quarkus:dev -Dquarkus.http.host=0.0.0.0 -Dquarkus.http.port=8080 -DskipTests
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/portfolio
      - QUARKUS_DATASOURCE_USERNAME=portfolio
      - QUARKUS_DATASOURCE_PASSWORD=portfolio
      - QUARKUS_HTTP_PORT=8080
    ports:
      - "8080:8080"
    restart: unless-stopped

  admin:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./admin:/app
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port 4200"
    depends_on:
      backend:
        condition: service_started
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "4200:4200"
    restart: unless-stopped

volumes:
  db-data:
  backend-target:
  m2-cache:
