quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location,content-disposition
quarkus.http.cors.access-control-max-age=24H

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:portfolio}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:portfolio}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/portfolio}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.hibernate-orm.database.generation=validate

mp.jwt.verify.issuer=portfolio
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=rsaPublicKey.pem

portfolio.admin.username=${PORTFOLIO_ADMIN_USERNAME:admin}
portfolio.admin.password=${PORTFOLIO_ADMIN_PASSWORD:admin}

quarkus.http.auth.permission.public-get.paths=/api/*
quarkus.http.auth.permission.public-get.methods=GET,HEAD,OPTIONS
quarkus.http.auth.permission.public-get.policy=permit

quarkus.http.auth.permission.login.paths=/api/auth/login
quarkus.http.auth.permission.login.methods=POST,OPTIONS
quarkus.http.auth.permission.login.policy=permit

quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.methods=POST,PUT,DELETE,PATCH
quarkus.http.auth.permission.authenticated.policy=authenticated
