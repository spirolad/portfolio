<div class="flex h-screen bg-slate-100 text-slate-900">
  <aside class="flex w-72 shrink-0 flex-col border-r border-slate-200 bg-white p-6">
    <div class="mb-8">
      <div class="text-xl font-semibold">{{ title() }}</div>
    </div>

    <nav class="space-y-2">
      @for (link of links; track link.path) {
        <a
          class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium transition hover:bg-slate-100"
          [routerLink]="link.path"
          routerLinkActive="bg-slate-100 text-slate-900"
        >
          <span>{{ link.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <section class="flex min-w-0 flex-1 flex-col">
    <header class="flex items-center gap-3 border-b border-slate-200 bg-white px-6 py-4">
      <span class="text-sm font-semibold uppercase tracking-wide text-slate-500">Backoffice</span>
    </header>

    <main class="min-w-0 flex-1 overflow-auto p-6">
      <router-outlet />
    </main>
  </section>
</div>
